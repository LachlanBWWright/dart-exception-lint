name: dart_exception_lint
description: Analyzer plugin for detecting statically discoverable synchronous, asynchronous, deferred, and unknown Dart exception boundaries.
version: 0.1.0-dev.1
repository: https://github.com/LachlanBWWright/dart-exception-lint
topics:
  - analyzer-plugin
  - lint
  - exceptions

environment:
  sdk: ^3.11.0

dependencies:
  analysis_server_plugin: ^0.3.20
  analyzer: '>=14.1.0 <14.2.0'
  analyzer_plugin: ^0.14.14
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  analyzer_testing: ^0.3.4
  crypto: ^3.0.8
  lints: ^6.0.0
  test: ^1.26.0
  test_reflective_loader: ^0.4.0
